services:
  - type: web
    name: bitlearn-soykam
    runtime: node
    region: oregon
    plan: free
    healthCheckPath: /api/health
    buildCommand: npm --prefix backend ci --omit=dev && npm --prefix frontend ci --include=dev && npm --prefix frontend run build
    startCommand: cd backend && npm run db:migrate && npm run db:seed:catalog && npm run db:seed:questions && npm run db:seed:flashcards && npm start
    envVars:
      - key: NODE_VERSION
        value: 24.14.0
      - key: NODE_ENV
        value: production
      - key: AUTH_JWT_SECRET_HEX
        sync: false
      - key: AUTH_JWT_ISSUER
        value: bitlearn-api
      - key: AUTH_JWT_AUDIENCE
        value: bitlearn-web
      - key: AUTH_ALLOW_INSECURE_COOKIE
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: bitlearn-soykam-db
          property: connectionString

databases:
  - name: bitlearn-soykam-db
    region: oregon
    plan: free
    postgresMajorVersion: "16"
    ipAllowList: []
